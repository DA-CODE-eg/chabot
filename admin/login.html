<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Panel Admin - Legal Segura</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background: #f3f5f7;
        margin: 0;
        padding: 0;
      }
      .container {
        max-width: 420px;
        margin: 80px auto;
        background: #fff;
        padding: 32px;
        border-radius: 12px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
      }
      h1 {
        margin: 0 0 16px;
        font-size: 22px;
      }
      label {
        display: block;
        margin-top: 12px;
        font-size: 14px;
      }
      input {
        width: 100%;
        padding: 10px;
        margin-top: 6px;
        border: 1px solid #ccd4dc;
        border-radius: 8px;
      }
      button {
        width: 100%;
        margin-top: 18px;
        padding: 12px;
        background: #1b5cff;
        border: none;
        color: #fff;
        border-radius: 8px;
        cursor: pointer;
        font-weight: 600;
      }
      .error {
        margin-top: 14px;
        color: #d93025;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Acceso Panel Admin</h1>
      <form method="post" action="/admin/login">
        <label for="username">Usuario</label>
        <input id="username" name="username" type="text" required />
        <label for="password">Contraseña</label>
        <input id="password" name="password" type="password" required />
        <button type="submit">Ingresar</button>
      </form>
      <div class="error" id="error" style="display: none;">
        Usuario o contraseña incorrectos.
      </div>
    </div>

    <script>
      const params = new URLSearchParams(window.location.search);
      if (params.get("error")) {
        document.getElementById("error").style.display = "block";
      }
    </script>
  </body>
</html>
